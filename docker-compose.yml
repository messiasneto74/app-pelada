# Opção A local: postgres-app + postgres-keycloak + keycloak + api (F0-7).
services:
  postgres-app:
    image: postgres:16-alpine
    container_name: pelada-postgres-app
    restart: unless-stopped
    ports:
      - "${POSTGRES_APP_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_APP_USER:-pelada_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-pelada_app_dev}
      POSTGRES_DB: pelada_app
    volumes:
      - pelada_pg_app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER:-pelada_app} -d pelada_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: pelada-postgres-keycloak
    restart: unless-stopped
    ports:
      - "${POSTGRES_KEYCLOAK_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-keycloak_dev}
      POSTGRES_DB: keycloak
    volumes:
      - pelada_pg_keycloak:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_KEYCLOAK_USER:-keycloak} -d keycloak",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: pelada-keycloak
    restart: unless-stopped
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8080}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-keycloak_dev}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      # Keycloak 26+: KEYCLOAK_ADMIN* foi removido — use bootstrap (só na 1ª subida)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_dev}
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: pelada-api:local
    container_name: pelada-api
    restart: unless-stopped
    depends_on:
      postgres-app:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-pelada_app}:${POSTGRES_APP_PASSWORD:-pelada_app_dev}@postgres-app:5432/pelada_app
      # Issuer no token (browser) continua localhost; JWKS é resolvido na rede do compose.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/pelada}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/pelada/protocol/openid-connect/certs
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}

volumes:
  pelada_pg_app:
  pelada_pg_keycloak:
