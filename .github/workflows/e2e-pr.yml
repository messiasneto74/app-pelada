# E2E-1 — Playwright com stack Docker (evidência reproduzível no PR).
name: E2E (Playwright)

on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'scripts/run-e2e.mjs'
      - 'scripts/lib/e2e-*.mjs'
      - '.github/workflows/e2e-pr.yml'
      - 'docker-compose.yml'
  workflow_dispatch:

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: .env mínimo
        run: cp .env.example .env

      - name: npm ci
        run: npm ci

      - name: Chrome (Playwright)
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Stack Docker (Postgres + Keycloak + API)
        run: docker compose up -d --build

      - name: Migrations Postgres app
        run: npm run db:migrate

      - name: Aguardar IdP + API
        run: |
          npm run smoke:keycloak
          npm run smoke:stack

      - name: Build core + dev:web (background)
        run: |
          npm run build:core
          npm run dev:web &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4200/ >/dev/null; then
              echo "Web OK"
              exit 0
            fi
            sleep 5
          done
          echo "Web não subiu a tempo"
          exit 1

      - name: npm run test:e2e:playwright
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e:playwright

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
