# E2E-1 — Playwright com stack Docker (evidência reproduzível no PR).
name: E2E (Playwright)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: .env mínimo
        run: cp .env.example .env

      - name: npm ci
        run: npm ci

      - name: Chrome (Playwright)
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Postgres + Keycloak (Docker)
        run: docker compose up -d postgres-app postgres-keycloak keycloak

      - name: Migrations Postgres app
        run: npm run db:migrate

      - name: Aguardar Keycloak + build API/web
        run: |
          npm run smoke:keycloak
          npm run build:core
          npm run build:api

      - name: API + web (host)
        run: |
          (cd apps/api && nohup node --env-file=../../.env dist/main.js > ../../api-e2e.log 2>&1 &)
          nohup npm run start -w @pelada/web -- --host 0.0.0.0 --disable-host-check > web-e2e.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1 &&
               curl -fsS http://localhost:4200/ >/dev/null 2>&1; then
              echo "Stack OK"
              exit 0
            fi
            sleep 5
          done
          echo "=== api-e2e.log ===" && tail -n 100 api-e2e.log || true
          echo "=== web-e2e.log ===" && tail -n 100 web-e2e.log || true
          exit 1

      - name: npm run test:e2e:playwright
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e:playwright

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

  cursor-revisar-pr:
    name: Cursor Automation — revisar PR
    needs: test-e2e
    if: success() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aguardar test:all + R-07 no mesmo SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.event.pull_request.head.sha }}"
          for i in $(seq 1 36); do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '.check_runs[] | select(.name=="test:all + R-07") | .conclusion' | head -1)
            if [ "$conclusion" = "success" ]; then
              echo "test:all + R-07 verde no SHA ${sha}"
              exit 0
            fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "test:all + R-07 ${conclusion} — revisão já disparada em pr-tests.yml"
              exit 1
            fi
            sleep 10
          done
          echo "Timeout aguardando test:all + R-07"
          exit 1

      - name: Disparar automação Cursor (webhook opcional)
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_REVISAR_PR_WEBHOOK }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_AUTOMATION_REVISAR_PR_WEBHOOK_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::notice title=Cursor revisar PR::Sem secret CURSOR_AUTOMATION_REVISAR_PR_WEBHOOK — ver .github/CURSOR-REVISAR-PR-SETUP.md"
            exit 0
          fi
          curl_args=(-fsS -X POST "$WEBHOOK_URL" -H "Content-Type: application/json")
          if [ -n "${WEBHOOK_KEY:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${WEBHOOK_KEY}")
          fi
          payload=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --argjson pr "${{ github.event.pull_request.number }}" \
            --arg sha "${{ github.event.pull_request.head.sha }}" \
            --arg url "${{ github.event.pull_request.html_url }}" \
            --arg ci "success" \
            --arg e2e "success" \
            '{repository:$repo, pull_request_number:$pr, head_sha:$sha, pull_url:$url, ci_test_all_result:$ci, ci_test_e2e_result:$e2e}')
          curl "${curl_args[@]}" -d "$payload"
          echo "Webhook Cursor revisar PR enviado (test:all + test:e2e verdes)."
