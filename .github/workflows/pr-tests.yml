# CI-1 — testes objetivos do projeto.
# O parecer do agente é validado separadamente pelo check obrigatório `review-policy`.
name: PR tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-all:
    name: test:all + R-07
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres-app-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pelada_test
          POSTGRES_PASSWORD: pelada_test_dev
          POSTGRES_DB: pelada_app_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U pelada_test -d pelada_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout (histórico completo para R-07)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: .env mínimo (Jest/Prisma na API)
        run: cp .env.example .env

      - name: Chrome (Karma / test:web)
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: npm ci
        run: npm ci

      - name: Fetch branch base (diff R-07)
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Migrate Postgres de teste (integração API §B)
        run: npm run db:test:migrate

      - name: npm run test:all:ci
        env:
          COVERAGE_BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ github.workspace }}/scripts/chromium-ci.sh
          RUN_DB_TESTS: '1'
          DATABASE_URL_TEST: postgresql://pelada_test:pelada_test_dev@localhost:5435/pelada_app_test
        run: chmod +x scripts/chromium-ci.sh && xvfb-run --auto-servernum npm run test:all:ci
