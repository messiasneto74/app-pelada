# CI-1 — mesmo gate que a automação Cursor "app-pelada — revisar PR":
# npm run test:all (core + api + web + test:scripts:r07 / R-07 ≥80% no diff vs base).
# Falha aqui = PR vermelho no GitHub (requer branch protection para bloquear merge).
name: PR tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-all:
    name: test:all + R-07
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (histórico completo para R-07)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: .env mínimo (Jest/Prisma na API)
        run: cp .env.example .env

      - name: Chrome (Karma / test:web)
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: npm ci
        run: npm ci

      - name: Fetch branch base (diff R-07)
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: npm run test:all:ci
        env:
          COVERAGE_BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ github.workspace }}/scripts/chromium-ci.sh
        run: chmod +x scripts/chromium-ci.sh && xvfb-run --auto-servernum npm run test:all:ci

  cursor-revisar-pr:
    name: Cursor Automation — revisar PR
    needs: test-all
    if: >-
      always() &&
      needs.test-all.result != 'cancelled' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar automação Cursor (webhook opcional)
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_REVISAR_PR_WEBHOOK }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_AUTOMATION_REVISAR_PR_WEBHOOK_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::notice title=Cursor revisar PR::Sem secret CURSOR_AUTOMATION_REVISAR_PR_WEBHOOK. Configure trigger CI completed (check test:all + R-07) na automação — ver .github/CURSOR-REVISAR-PR-SETUP.md"
            exit 0
          fi
          curl_args=(-fsS -X POST "$WEBHOOK_URL" -H "Content-Type: application/json")
          if [ -n "${WEBHOOK_KEY:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${WEBHOOK_KEY}")
          fi
          payload=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --argjson pr "${{ github.event.pull_request.number }}" \
            --arg sha "${{ github.event.pull_request.head.sha }}" \
            --arg url "${{ github.event.pull_request.html_url }}" \
            --arg ci "${{ needs.test-all.result }}" \
            '{repository:$repo, pull_request_number:$pr, head_sha:$sha, pull_url:$url, ci_test_all_result:$ci}')
          curl "${curl_args[@]}" -d "$payload"
          echo "Webhook Cursor revisar PR enviado (test-all=${{ needs.test-all.result }})."
