name: Review policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-policy:
    name: review-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout da política confiável em main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar parecer do Cursor no SHA atual
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-review-policy.mjs
