<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Protótipo — App Pelada</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      min-height: 100vh;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid #2f3336; }
    }
    .sidebar {
      padding: 1rem;
      border-right: 1px solid #2f3336;
      overflow-y: auto;
    }
    .sidebar h1 { font-size: 1rem; margin: 0 0 0.5rem; }
    .sidebar p { font-size: 0.75rem; color: #71767b; margin: 0 0 1rem; }
    .group { margin-bottom: 1rem; }
    .group-title { font-size: 0.65rem; text-transform: uppercase; color: #71767b; margin-bottom: 0.35rem; }
    .nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.45rem 0.6rem;
      margin-bottom: 0.25rem;
      border: 1px solid #2f3336;
      border-radius: 8px;
      background: #16181c;
      color: #e7e9ea;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .nav-btn:hover, .nav-btn.active { border-color: #1d9bf0; background: #1a2633; }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem;
      gap: 1rem;
    }
    .route { font-size: 0.75rem; color: #1d9bf0; font-family: monospace; }
    .phone {
      width: 375px;
      max-width: 100%;
      min-height: 640px;
      border: 2px solid #2f3336;
      border-radius: 28px;
      background: #000;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }
    .phone-inner {
      flex: 1;
      background: #16181c;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .phone h2 { margin: 0; font-size: 1.1rem; }
    .pill {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      background: #1a2633;
      color: #1d9bf0;
    }
    .card {
      background: #0f1419;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.85rem;
    }
    .btn {
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      background: #1d9bf0;
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: default;
    }
    .btn.secondary { background: #2f3336; color: #e7e9ea; }
    .tabs {
      margin-top: auto;
      display: flex;
      justify-content: space-around;
      padding-top: 12px;
      border-top: 1px solid #2f3336;
      font-size: 0.65rem;
      color: #71767b;
    }
    .tabs span.active { color: #1d9bf0; font-weight: 600; }
    .row { display: flex; gap: 8px; }
    .row .card { flex: 1; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Protótipo — App Pelada</h1>
      <p>Clique para trocar de tela. Também disponível no Canvas do Cursor.</p>
      <div id="nav"></div>
    </aside>
    <main class="stage">
      <div class="route" id="route"></div>
      <div class="phone">
        <div class="phone-inner" id="screen"></div>
      </div>
    </main>
  </div>
  <script>
    const screens = {
      login: {
        route: "/entrar",
        html: `<h2>Entrar</h2>
          <button class="btn">Continuar com Google</button>
          <p style="font-size:0.8rem;color:#71767b">ou e-mail</p>
          <div class="card">campo e-mail</div>
          <p style="font-size:0.75rem">Perfil: nome · telefone · foto</p>
          <button class="btn">Entrar</button>`
      },
      home: {
        route: "/app",
        html: `<h2>Minhas peladas</h2>
          <div class="card"><strong>Pelada de Terça</strong><br/>Hoje 19h · 18/21</div>
          <button class="btn">+ Nova pelada</button>`
      },
      "nova-pelada": {
        route: "/app/nova-pelada",
        html: `<h2>Nova pelada</h2><span class="pill">Passo 2/4</span>
          <div class="card">6 linha · 3 times · Society</div>
          <div class="row"><button class="btn secondary">Anterior</button><button class="btn">Próximo</button></div>`
      },
      "hub-inicio": {
        route: "/app/p/[peladaId]",
        html: `<h2>Pelada de Terça</h2>
          <div class="card"><strong>Partida hoje</strong><br/>19:00 · Society Azaleia<br/><button class="btn" style="margin-top:8px">Presença</button></div>
          <div class="tabs"><span class="active">Início</span><span>Partidas</span><span>Elenco</span><span>Config</span></div>`
      },
      elenco: {
        route: "/app/p/[peladaId]/elenco",
        html: `<h2>Elenco</h2>
          <div class="card">Rafa · 7.2 · GK</div>
          <div class="card">Tiago · tags: corredor</div>
          <div class="tabs"><span>Início</span><span>Partidas</span><span class="active">Elenco</span><span>Config</span></div>`
      },
      config: {
        route: "/app/p/[peladaId]/config",
        html: `<h2>Config (adm)</h2>
          <div class="card">Regras da pelada</div>
          <div class="card">Regras do sorteio</div>
          <div class="card">Presença · Pagamento</div>
          <div class="tabs"><span>Início</span><span>Partidas</span><span>Elenco</span><span class="active">Config</span></div>`
      },
      partidas: {
        route: "/app/p/[peladaId]/partidas",
        html: `<h2>Partidas</h2>
          <div class="card">21/10 — aberta</div>
          <button class="btn">+ Nova</button>
          <div class="tabs"><span>Início</span><span class="active">Partidas</span><span>Elenco</span><span>Config</span></div>`
      },
      presenca: {
        route: "/app/p/[peladaId]/m/[matchId]/presenca",
        html: `<h2>Presença</h2><span class="pill">18 confirmados</span>
          <div class="card">Fila 2 · Convidado 1</div>
          <button class="btn">Fechar lista</button>`
      },
      sorteio: {
        route: "/app/p/[peladaId]/m/[matchId]/sorteio",
        html: `<h2>Sorteio</h2><span class="pill">Equilíbrio 92</span>
          <div class="row"><div class="card">Time A<br/>média 6.8</div><div class="card">Time B<br/>média 6.9</div></div>
          <button class="btn secondary">Regerar</button><button class="btn">WhatsApp</button>`
      },
      jogo: {
        route: "/app/p/[peladaId]/m/[matchId]/jogo",
        html: `<h2>Em campo</h2>
          <div class="card" style="text-align:center;font-size:1.2rem">A 2 × 1 B</div>
          <p style="font-size:0.8rem">Time C descansa · 23:14</p>
          <button class="btn">+ Gol</button>`
      },
      "link-publico": {
        route: "/c/[token]",
        html: `<h2>Presença</h2>
          <div class="card">Terça 19h</div>
          <button class="btn">Vou</button>
          <button class="btn secondary">Não vou</button>`
      }
    };
    const groups = [
      { title: "Auth", keys: ["login"] },
      { title: "App", keys: ["home", "nova-pelada"] },
      { title: "Pelada", keys: ["hub-inicio", "partidas", "elenco", "config"] },
      { title: "Dia do jogo", keys: ["presenca", "sorteio", "jogo"] },
      { title: "Convidado", keys: ["link-publico"] }
    ];
    const nav = document.getElementById("nav");
    let current = "hub-inicio";
    function render(id) {
      current = id;
      document.getElementById("screen").innerHTML = screens[id].html;
      document.getElementById("route").textContent = screens[id].route;
      document.querySelectorAll(".nav-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.id === id);
      });
    }
    groups.forEach((g) => {
      const div = document.createElement("div");
      div.className = "group";
      div.innerHTML = `<div class="group-title">${g.title}</div>`;
      g.keys.forEach((key) => {
        const btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.dataset.id = key;
        btn.textContent = screens[key].route.split("/").pop() || key;
        btn.onclick = () => render(key);
        div.appendChild(btn);
      });
      nav.appendChild(div);
    });
    render(current);
  </script>
</body>
</html>
